name: pieces
# Pull requests that add or change pieces (pieces/<name>/<version>/) are compiled and checked here.
on:
  pull_request:
    paths: ["pieces/**"]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: ./build.sh                       # builds the self-hosted compiler (compiler/target/kite)
      - run: KITE="$PWD/compiler/target/kite" scripts/verify-pieces.sh --base "origin/${{ github.base_ref }}"
